<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Aged paper texture: fine fibre grain over soft mottling. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"
      stitchTiles="stitch" />
    <feColorMatrix
      values="0 0 0 0 0.38  0 0 0 0 0.26  0 0 0 0 0.12  0 0 0 0.7 -0.25" />
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4"
      seed="7" stitchTiles="stitch" />
    <feColorMatrix
      values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.16  0 0 0 0.9 -0.38" />
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" />
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
